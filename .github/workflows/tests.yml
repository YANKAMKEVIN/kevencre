name: Tests

# Bloquant : chaque job doit être vert pour fusionner (règle de protection de la branche main
# à activer dans GitHub : Settings > Branches > « Require status checks » sur ces trois jobs).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_SILENCE_ROOT_WARNING: 1

jobs:
  tests:
    name: Import, scripts, tailles, tests headless
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Installer Godot 4.3
        run: echo "GODOT=$(tools/install_godot.sh "$RUNNER_TEMP/godot")" >> "$GITHUB_ENV"
      - name: Import du projet (aucune erreur de script)
        run: tools/test.sh import
      - name: Garde-fou de taille (400 lignes par script)
        run: tools/test.sh sizes
      - name: Tous les scripts se chargent
        run: tools/test.sh check
      - name: Tests unitaires et d'intégration
        run: tools/test.sh unit
      - name: Le robot joue toute la partie sans écran
        run: tools/test.sh robot
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-tests
          path: ci-out/
          retention-days: 7

  parcours:
    name: Parcours du chapitre ${{ matrix.niveau }} (modèle contre moteur, atteignabilité)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        niveau: ['1', '2', '3']
    steps:
      - uses: actions/checkout@v4
      - name: Installer Godot 4.3
        run: echo "GODOT=$(tools/install_godot.sh "$RUNNER_TEMP/godot")" >> "$GITHUB_ENV"
      - name: Import du projet
        run: tools/test.sh import
      - name: Analyse de parcours
        env:
          PARCOURS_ARGS: --niveau=${{ matrix.niveau }}
        run: tools/test.sh parcours
      - name: Journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-parcours-${{ matrix.niveau }}
          path: ci-out/
          retention-days: 7

  partie:
    name: Partie complète (3 chapitres + Délaveur)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Installer Godot 4.3 et un écran virtuel
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          echo "GODOT=$(tools/install_godot.sh "$RUNNER_TEMP/godot")" >> "$GITHUB_ENV"
      - name: Le robot joue jusqu'à la fin
        run: tools/ci.sh
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: ci-out/
          retention-days: 7
